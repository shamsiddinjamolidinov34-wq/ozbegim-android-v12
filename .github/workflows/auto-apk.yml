name: Auto APK
on:
  push:
    branches: [ auto-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK litsenziyalari (avto-o'rnatish)
        run: |
          SM=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SM="$p"; break; fi
          done
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-36" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "sdk ready"

      - name: APK build
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: APK'ni apk-output branch'iga yozish
        run: |
          set -e
          APK=""
          for f in $(find . -type f -path '*outputs/apk/debug/*.apk' 2>/dev/null); do APK="$f"; break; done
          if [ -z "$APK" ]; then
            for f in $(find . -type f -name '*.apk' 2>/dev/null); do APK="$f"; break; done
          fi
          if [ -z "$APK" ]; then
            echo "::error::APK topilmadi — build chiqmadi"
            find . -type d -name outputs 2>/dev/null | head -5 || true
            exit 1
          fi
          echo "APK=$APK"
          git config user.email "auto-apk-bot@users.noreply.github.com"
          git config user.name "Auto APK Bot"
          git checkout --orphan apk-output 2>/dev/null || git checkout -b apk-output
          git reset -q
          git add -f "$APK"
          git commit -m "apk build $(date +%s)" || true
          git push -f origin HEAD:apk-output
